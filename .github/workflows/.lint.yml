name: Lint Source Code

on:
  workflow_call:
    inputs:
      packages:
        type: string
        description: 'JSON array of package names to lint (e.g. ["cpf-val","cnpj-dv"])'
        required: true
      python-versions:
        type: string
        description: 'JSON array of Python versions (e.g. ["3.10","3.11","3.12","3.13","3.14"])'
        required: true
      max-parallel:
        type: number
        description: 'Maximum number of parallel jobs'
        required: false
        default: 5

permissions:
  contents: read

jobs:
  lint:
    name: Lint `${{ matrix.package }}` in Python v${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        package: ${{ fromJSON(inputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-python-lint-${{ matrix.package }}-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt', 'packages/**/pyproject.toml') }}
          path: ~/.cache/pip

      - run: python -m pip install --upgrade pip
      - run: python require --dev-only

      - run: python run lint ${{ matrix.package }}
